name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and assemble
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: |
          # The live website check is an integration probe, not a deterministic unit test.
          # Keep every other core/app test gating CI; provider health runs separately.
          cat > "$RUNNER_TEMP/opentv-ci-test-filter.gradle" <<'EOF'
          allprojects {
              tasks.withType(org.gradle.api.tasks.testing.Test).configureEach {
                  filter {
                      excludeTestsMatching("*.HdFilmCehennemiProviderTest.search_liveNetwork_returnsResults")
                  }
              }
          }
          EOF
          ./gradlew test --init-script "$RUNNER_TEMP/opentv-ci-test-filter.gradle" --stacktrace

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: opentv-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
